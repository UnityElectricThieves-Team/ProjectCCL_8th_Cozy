name: Auto merge design-document to develop

on:
  push:
    branches:
      - design-document

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Merge design-document into develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin design-document
          git merge origin/design-document --no-ff --no-edit
          git push origin develop
